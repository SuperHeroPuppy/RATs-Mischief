plugins {
    id 'maven-publish'
    id 'fabric-loom' version '1.9.2'
}

archivesBaseName = project.archives_base_name
version = project.version
group = project.maven_group

repositories {
	mavenLocal()

	maven {
		name = "Stellardrift Snapshots"
		url = "https://repo.stellardrift.ca/maven/snapshots/"
	}
	// publishing
	maven {
		name = "CurseForge"
		url = "https://minecraft.curseforge.com/api/maven"
	}

	// cloth config
	maven { url "https://maven.shedaniel.me/" }

	// Cardinal Components and other Ladysnake libraries
	maven {
		name = "Ladysnake Mods"
		url = "https://maven.ladysnake.org/releases"
	}

	// mod menu
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	 }

	maven { url 'https://jitpack.io' }
	maven { url 'https://repo.sleeping.town/' }

	maven {
		name "modrinth"
		url "https://api.modrinth.com/maven"
	}

	maven { url 'https://masa.dy.fi/maven' }

	maven {
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content {
			includeGroupByRegex('software\\.bernie.*')
			includeGroup('com.eliotlash.mclib')
		}
	}

	maven {
		url = 'https://maven.jamieswhiteshirt.com/libs-release/'
		content {
			includeGroup 'com.jamieswhiteshirt'
		}
	}

	maven {
		url = 'https://oss.sonatype.org/content/repositories/snapshots'
		content {
			includeGroup 'me.lucko'
		}
	}

	// ears
	maven { url "https://repo.unascribed.com" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${minecraft_version}+build.${yarn_mappings}:v2"

	modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
	implementation "com.eliotlash.mclib:mclib:20"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// mod menu
	modImplementation("com.terraformersmc:modmenu:${mod_menu_version}") { transitive = false }

	// ok zoomer
//	runtimeOnly("com.github.EnnuiL:OkZoomer:1.19.2-SNAPSHOT")

	// trinkets
	modImplementation ("dev.emi:trinkets:${project.trinkets_version}")
	modImplementation ("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}")
	modImplementation ("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}")
}

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand "version": version
	}
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    withSourcesJar()
}

// Minecraft 1.20.1 and this version of Mixin must run on Java 17 even when
// Gradle itself was started with a newer JDK.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// If you plan to use a different file for the license, don't forget to change the file name here!
jar {
	from('LICENSE') {
		rename { "${it}_${archivesBaseName}" }
	}
}
